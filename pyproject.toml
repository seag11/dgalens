[project]
name = "dgalens"
version = "0.1.0"
description = "Detect algorithmically generated (DGA) domains with a character-level Markov model. CLI + FastAPI."
readme = "README.md"
license = "MIT"
authors = [
    { name = "seag11" }
]
requires-python = ">=3.12"
keywords = ["dga", "malware", "dns", "threat-detection", "markov-chain", "security"]
dependencies = [
    "fastapi>=0.115",
    "tldextract>=5.1",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
dgalens = "dgalens.cli:app"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
